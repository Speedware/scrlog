name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = (Select-String -Path scrlog.csproj -Pattern '<Version>(.+)</Version>').Matches[0].Groups[1].Value
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build application
        run: dotnet build scrlog.csproj -c Release -o publish -p:Version=${{ steps.version.outputs.version }}

      # Одна версия ffmpeg для обеих архитектур: 64-бит от BtbN, 32-бит из его форка defisym (BtbN 32-бит не собирает)
      - name: Download FFmpeg (x64 and x86)
        shell: pwsh
        run: |
          $builds = @{
            'x64' = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip'
            'x86' = 'https://github.com/defisym/FFmpeg-Builds-Win32/releases/download/latest/ffmpeg-n8.1-latest-win32-gpl-8.1.zip'
          }
          foreach ($arch in $builds.Keys) {
            Invoke-WebRequest $builds[$arch] -OutFile "ffmpeg-$arch.zip"
            Expand-Archive "ffmpeg-$arch.zip" -DestinationPath "ffmpeg-$arch-src"
            New-Item -ItemType Directory -Force "ffmpeg\$arch" | Out-Null
            $exe = Get-ChildItem "ffmpeg-$arch-src" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            Copy-Item $exe.FullName "ffmpeg\$arch\ffmpeg.exe"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer\scrlog.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: scrlog-setup-${{ steps.version.outputs.version }}
          path: installer/Output/*.exe

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
